- id: who_keeps
  title: "Who Keeps the Peace? Gendered Effects in UN Peacekeeping"
  coauthors: []
  venue: "International Studies Quarterly"
  status: rr
  topics: [gender, pk]
  grad: false
  ext: false
  jmp: true
  abstract: "Why are some peacekeepers more effective than others? Most analyses of peacekeeper effectiveness fail to account for gendered effects, while work on gender in peacekeeping hasn't taken advantage of recent advances in data. By unifying the literature on female peacekeepers and trust, this paper provides the first comprehensive framework explaining how women enhance UN peacekeeper effectiveness. Using two-way fixed-effects models and optimal matching, I provide the first quantitative empirical evidence that including more women in a force can dramatically increase its effectiveness against rebel one-sided violence."
  links:
    - {label: "Current draft", url: "https://www.skytheacademic.com/files/who_keeps_the_peace.pdf"}
    - {label: "Replication archive", url: "https://github.com/skytheacademic/who_keeps_the_peace"}
  awards:
    - {text: "ISA Midwest Lynne Rienner Award", icon: award}
    - {text: "ISA IO Section Finkelstein Prize (Special Mention)", icon: award}
  cv:
    section: inprogress
    order: 1
    items: ["ISA Midwest Lynne Rienner Award", "ISA IO Section Finkelstein Prize Special Mention"]

