# ============================================================================
# Single source of truth for publications.
# Consumed by scripts/build_from_data.py, which generates BOTH:
#   - the Research page cards  (writes the #grid block in _pages/research.md)
#   - the CV entry blocks      (writes cv/pubs_papers.tex and cv/pubs_other.tex, \input by cv.tex)
# Edit here, then run:  python3 scripts/build_from_data.py
#
# Shared facts (title, coauthors, venue, status, topics, links) live here once.
# Author display strings + LaTeX/HTML are DERIVED by the generator, so the CV
# and the website can never disagree about a title, venue, or status.
#
# Fields per entry:
#   id            unique slug
#   title         display title (Research page)
#   title_cv      optional override if the CV uses a different title
#   coauthors     list of FULL names ([] = solo). 1 coauthor -> full name on the
#                 site; 2+ -> surnames. CV always uses full names.
#   venue         journal/handbook (shown on site for published/forthcoming/rr)
#   status        published | forthcoming | cond_accept | rr | under_review | working | wip
#   topics        any of: pk gender pmsc methods
#   grad / ext    CV co-author flags ( * grad student, dagger external )
#   jmp           true on the job-market paper
#   dtag          optional small tag in the card status column (e.g. Database)
#   abstract      detail text shown under an "Abstract" label
#   desc          detail text shown with no label (use instead of abstract)
#   links         list of {label, url}; the first PDF is reused for the CV
#   awards        list of {text, icon?} shown as chips on the card (icon: award|landmark)
#   cv            { section: journal|inprogress|other, order: int,
#                   pages: "...", items: [..], book/editors/publisher/year }
# ============================================================================

- id: violence_condition
  title: "Violence as a Condition: Structure, Composition, and the Use of Lethal Force"
  coauthors: ["Matthew Kyle Ellis"]
  venue: "Journal of Conflict Resolution"
  status: published
  topics: [pmsc]
  grad: true
  ext: true
  abstract: "Since 2014, Russia's Wagner Group has expanded from driving Russian foreign policy across Africa and the Middle East into an integral part of the 2022 invasion of Ukraine. We first draw on the one-sided violence (OSV) literature to show how organizational incentives explain Wagner's violence against civilians pre-November 2021. Despite the static context of those incentives, Wagner's OSV lethality increased dramatically after the invasion. Introducing pre-combat experience (PCE) as an explanatory factor, we provide novel theoretical logic and empirical evidence for how individual-level experience aggregates to unit-level violence."
  links:
    - {label: "PDF", url: "https://www.skytheacademic.com/files/violence_as_a_condition.pdf"}
    - {label: "Replication archive", url: "https://dataverse.harvard.edu/citation?persistentId=doi:10.7910/DVN/2FB6KD"}
  awards:
    - {text: "Requested by the U.S. Congressional Research Service for distribution", icon: landmark}
  cv:
    section: journal
    order: 1
    pages: "OnlineFirst. 1-26."
    items: ["Requested by United States Congressional Research Service for distribution."]

- id: here_today
  title: "Here Today, Gone Tomorrow: Dynamics of Peacekeeper Entry and Exit on Violence Against Civilians"
  coauthors: ["Douglas B. Atkinson", "Rebecca Dudley", "Zach Warner"]
  venue: "International Political Science Review"
  status: forthcoming
  topics: [pk]
  grad: false
  ext: true
  abstract: "Following the 2001 assassination of President Kabila, the UN deployed a peacekeeping mission to the DRC to quell violence against civilians, with mixed results. Using fine-grained subnational data, we examine how the geographic distribution of violence changed before, during, and after peacekeeper deployment, and how withdrawal reshaped local violence and its spread across borders."
  links:
    - {label: "Current draft", url: "https://www.skytheacademic.com/files/When_PKs_Leave.pdf"}
    - {label: "Replication archive", url: "https://github.com/skytheacademic/when_peacekeepers_leave"}
  cv:
    section: journal
    order: 2
    forthcoming_word: "Accepted"

