- id: double_delegation
  title: "Double Delegation: The UN Private Security Contractor Database"
  title_cv: "Double Delegation: An Exploration and Construction of the UN Private Security Contractor Database"
  coauthors: []
  status: working
  topics: [pmsc]
  grad: false
  ext: false
  dtag: "Database"
  abstract: "Principal-agent scholars rarely go past the second level on the delegation chain, especially for delegation from international organizations to private security contractors (PSCs). I argue that delegating authority a second time to PSCs operating outside the direct control of IOs like the UN harms UN authority derived from local actors while increasing state delegation costs. I build the concept of double delegation and assemble a descriptive database of PSC use in UN missions."
  links:
    - {label: "Current draft", url: "https://www.skytheacademic.com/files/double_delegation.pdf"}
  cv:
    section: inprogress
    order: 3

